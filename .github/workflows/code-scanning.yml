name: Code Scanning
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

env:
  PROMPTVISER_JWT_SEED: testseed
  PROMPTVISER_DP_SEED: testseed
  PROMPTVISER_GITHUB_CLIENT_ID: testclientid
  PROMPTVISER_GITHUB_CLIENT_SECRET: testclientsecret

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Configure promptviser config path
        run: echo "PROMPTVISER_CONFIG_DIR=$GITHUB_WORKSPACE/etc/dev" >> "$GITHUB_ENV"

      - name: Prepare tools
        run: make tools

      - name: Prepare local stack
        run: make folders gen_test_certs start-localstack start-sql build

      - name: Start promptviser server
        run: |
          nohup ./bin/promptviser --cfg "$GITHUB_WORKSPACE/etc/dev/promptviser-config.yaml" --only-server wfe > /tmp/promptviser/promptviser.log 2>&1 &
          echo $! > /tmp/promptviser/promptviser.pid

      - name: Wait for server readiness
        run: |
          for i in $(seq 1 60); do
            if curl -kfs https://localhost:7880/healthz >/dev/null; then
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/promptviser/promptviser.pid)" 2>/dev/null; then
              echo "promptviser exited before becoming ready"
              cat /tmp/promptviser/promptviser.log
              exit 1
            fi

            echo "waiting for promptviser... ($i/60)"
            sleep 2
          done

          echo "promptviser did not become ready in time"
          cat /tmp/promptviser/promptviser.log
          exit 1

      - name: Run scan and write SARIF
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          if [ -z "$AZURE_OPENAI_API_KEY" ]; then
            echo "AZURE_OPENAI_API_KEY is required for this workflow"
            exit 1
          fi

          ./bin/promptviserctl scan . \
            --http \
            --server https://localhost:7880 \
            --cfg "$GITHUB_WORKSPACE/etc/dev/promptviser-config.yaml" \
            --trusted-ca /tmp/promptviser/certs/trusty_root_ca.pem \
            --storage /tmp/promptviser \
            --sarif \
            --sarif-output promptviser.sarif.json

      - name: Filter SARIF to changed files
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "origin/$BASE_REF...HEAD" > changed-files.txt
          else
            git diff --name-only "$BEFORE_SHA...HEAD" > changed-files.txt
          fi

          changed_files=$(jq -Rsc 'split("\n") | map(select(length > 0))' changed-files.txt)
          jq --argjson changed "$changed_files" '
            .runs[].results |= map(
              select(any(.locations[]?; .physicalLocation.artifactLocation.uri as $uri | $changed | index($uri)))
            )
          ' promptviser.sarif.json > promptviser.changed.sarif.json

      - name: Upload complete SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptviser-sarif-${{ github.run_id }}
          path: promptviser.sarif.json
          if-no-files-found: warn

      - name: Upload SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: promptviser.changed.sarif.json