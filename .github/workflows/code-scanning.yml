name: Code Scanning
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Configure promptviser config path
        run: echo "PROMPTVISER_CONFIG_DIR=$GITHUB_WORKSPACE/etc/dev" >> "$GITHUB_ENV"

      - name: Prepare tools
        run: make tools

      - name: Prepare local stack
        run: make folders gen_test_certs start-localstack start-sql build

      - name: Start promptviser server
        run: |
          nohup ./bin/promptviser --cfg etc/dev/promptviser-config.unittest.yaml --only-server wfe > /tmp/promptviser/promptviser.log 2>&1 &
          echo $! > /tmp/promptviser/promptviser.pid

      - name: Wait for server readiness
        run: |
          until curl -kfs https://localhost:7880/healthz >/dev/null; do
            echo "waiting for promptviser..."
            sleep 2
          done

      - name: Run scan and write SARIF
        run: |
          ./bin/promptviserctl scan . \
            --server https://localhost:7880 \
            --cfg etc/dev/promptviser-config.unittest.yaml \
            --storage /tmp/promptviser \
            --sarif \
            --sarif-output promptviser.sarif.json

      - name: Upload SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: promptviser.sarif.json